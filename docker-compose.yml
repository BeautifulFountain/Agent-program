services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_PATH: /app/data/agentflow.db
    ports:
      - "8000:8000"
    volumes:
      - agentflow_data:/app/data
      - agentflow_external_knowledge:/app/knowledge/external
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  agentflow_data:
  agentflow_external_knowledge:
